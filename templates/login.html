{% extends "base.html" %}
{% block title %}sign in · apen-fredag{% endblock %}
{% block content %}
<div class="card center">
  <h1>Sign in</h1>
  <p class="dim">Enter. If it works, the cookie is watching you. (It's HttpOnly, so it can't peek back.)</p>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Username
      <input type="text" name="username" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <label class="check">
      <input type="checkbox" name="remember"> Remember me (30 days of cookie trust)
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="dim">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
