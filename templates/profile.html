{% extends "base.html" %}
{% block title %}profile · apen-fredag{% endblock %}
{% block content %}
<div class="card center">
  <h1>Profile</h1>
  <table class="facts">
    <tr><td class="dim">Username</td><td>{{ current_user.username }}</td></tr>
    <tr><td class="dim">Member since</td><td>{{ created_at | human_time }} UTC</td></tr>
  </table>
  <h2>Change password</h2>
  <form method="post" action="{{ url_for('profile') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Current password
      <input type="password" name="current" required autocomplete="current-password">
    </label>
    <label>New password
      <input type="password" name="new" required minlength="8" autocomplete="new-password">
    </label>
    <label>Confirm new password
      <input type="password" name="new2" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit">Update password</button>
  </form>
</div>
{% endblock %}
