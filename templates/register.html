{% extends "base.html" %}
{% block title %}register · apen-fredag{% endblock %}
{% block content %}
<div class="card center">
  <h1>Create account</h1>
  <p class="dim">Your password will be stretched with 200,000 rounds of PBKDF2. Slow is a feature.</p>
  <form method="post" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Username
      <input type="text" name="username" required minlength="3" maxlength="32" autofocus
             value="{{ username or '' }}" pattern="[A-Za-z0-9_.-]+"
             title="Letters, numbers, _ . -" autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <label>Confirm password
      <input type="password" name="password2" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit">Create account</button>
  </form>
  <p class="dim">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
